name: 'GHCR: Anthropic prompt cache image'

# Build n8n image with Anthropic prompt caching patches and push to
# ghcr.io/tnj/n8n-anthropic-prompt-cache. Tags: <short-sha> + latest.

on:
  push:
    branches:
      - feat/anthropic-prompt-caching-spec
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '24.14.1'
  PNPM_VERSION: '10.32.1'
  IMAGE_BASE_NAME: ghcr.io/tnj/n8n-anthropic-prompt-cache

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build n8n (compiled/)
        run: node scripts/build-n8n.mjs
        env:
          NODE_OPTIONS: '--max-old-space-size=7168'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: node scripts/dockerize-n8n.mjs
        env:
          IMAGE_BASE_NAME: ${{ env.IMAGE_BASE_NAME }}
          IMAGE_TAG: ${{ steps.sha.outputs.short }}
          DOCKER_BUILD_PLATFORM: linux/amd64

      - name: Tag as latest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_BASE_NAME }}:latest \
            ${{ env.IMAGE_BASE_NAME }}:${{ steps.sha.outputs.short }}
